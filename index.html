<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R6S Squad Challenges</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="title-badge">// Rainbow Six Siege //</div>
    <h1>Squad Challenges</h1>
    <div class="divider"></div>
</header>

<main>
    <div class="operators-grid">
        <div class="op-card attacker" id="atk-card">
            <div class="op-role">Attacker</div>
            <div class="op-icon" id="atk-icon">?</div>
            <div class="op-name" id="atk-name">
                <span class="empty-state">— READY —</span>
            </div>
        </div>
        <div class="op-card defender" id="def-card">
            <div class="op-role">Defender</div>
            <div class="op-icon" id="def-icon">?</div>
            <div class="op-name" id="def-name">
                <span class="empty-state">— READY —</span>
            </div>
        </div>
    </div>

    <div class="challenges-grid">
        <div class="challenge-card p1">
            <div class="challenge-label">// Player 1</div>
            <div id="challenge-p1" class="empty-state">— STANDBY —</div>
        </div>
        <div class="challenge-card p2">
            <div class="challenge-label">// Player 2</div>
            <div id="challenge-p2" class="empty-state">— STANDBY —</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-full" id="btn-full">⚡ Operators + Challenge</button>
        <button class="btn btn-challenge" id="btn-challenge">↻ New Challenge Only</button>
    </div>
</main>

<footer>R6S SQUAD CHALLENGE GENERATOR &nbsp;·&nbsp; YEAR 11</footer>

<script src="script.js"></script>
</body>
</html>
