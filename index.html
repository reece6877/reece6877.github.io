<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R6S Challenge Generator</title>
    <style>
        :root { --r6-orange: #ffaa00; --r6-dark: #1a1a1a; --r6-gray: #2d2d2d; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--r6-dark); color: var(--white); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        h1 { border-bottom: 4px solid var(--r6-orange); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }
        .generator-container { background-color: var(--r6-gray); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 850px; width: 100%; border: 1px solid #444; }
        .ops-display { display: flex; justify-content: space-around; margin-bottom: 30px; gap: 20px; }
        .op-card { flex: 1; background: #111; padding: 15px; border-top: 5px solid var(--r6-orange); border-radius: 4px; }
        .op-photo-box { width: 100%; height: 280px; background-color: #222; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px solid #333; overflow: hidden; }
        .op-photo-box img { width: 100%; height: 100%; object-fit: contain; }
        .op-name { font-weight: bold; font-size: 1.3rem; text-transform: uppercase; color: var(--r6-orange); letter-spacing: 1px; }
        #challenge-display { min-height: 80px; margin: 20px 0; padding: 20px; background: rgba(255, 170, 0, 0.05); border-left: 5px solid var(--r6-orange); font-size: 1.1rem; line-height: 1.5; text-align: left; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { background-color: var(--r6-orange); color: black; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { background-color: #ffc247; transform: translateY(-2px); }
        button.secondary { background-color: #444; color: white; }
    </style>
</head>
<body>

    <h1>R6S Squad Challenges</h1>

    <div class="generator-container">
        <div class="ops-display">
            <div class="op-card">
                <div class="op-photo-box" id="atk-photo">?</div>
                <div class="op-name" id="atk-name">Attacker</div>
            </div>
            <div class="op-card">
                <div class="op-photo-box" id="def-photo">?</div>
                <div class="op-name" id="def-name">Defender</div>
            </div>
        </div>
        <div id="challenge-display">Click "Generate Full Loadout" to start.</div>
        <div class="btn-group">
            <button onclick="generateAll()">Generate Full Loadout</button>
            <button class="secondary" onclick="rerollChallenge()">New Challenge Only</button>
        </div>
    </div>

    <script>
        const attackers = ["Sledge", "Thatcher", "Ash", "Thermite", "Twitch", "Montagne", "Glaz", "Fuze", "Blitz", "IQ", "Buck", "Blackbeard", "Capitao", "Hibana", "Jackal", "Ying", "Zofia", "Dokkaebi", "Lion", "Finka", "Maverick", "Nomad", "Gridlock", "Nokk", "Amaru", "Kali", "Iana", "Ace", "Zero", "Flores", "Osa", "Sens", "Grim", "Brava", "Ram", "Deimos", "Striker", "Rauora", "Solidsnake"];
        const defenders = ["Smoke", "Mute", "Castle", "Pulse", "Doc", "Rook", "Kapkan", "Tachanka", "Jager", "Bandit", "Frost", "Valkyrie", "Caveira", "Echo", "Mira", "Lesion", "Ela", "Vigil", "Maestro", "Alibi", "Clash", "Kaid", "Mozzie", "Warden", "Goyo", "Wamai", "Oryx", "Melusi", "Aruni", "Thunderbird", "Thorn", "Azami", "Solis", "Fenrir", "Tubarao", "Sentry", "Skopos"];

        const challenges = [
            "**Iron Sights Only:** No optics allowed.",
            "**Pistol Only:** Secondaries only for the full round.",
            "**No Sprinting:** You must walk everywhere.",
            "**Shield Rush:** Squad must pick shields.",
            "**The Backpack:** Stay directly behind Monty's shield.",
            "**Floor is Lava:** Stay on furniture/hatches in OBJ.",
            "**Utility Only:** No guns until final 0:45."
        ];

        function generateAll() {
            const atk = attackers[Math.floor(Math.random() * attackers.length)];
            const def = defenders[Math.floor(Math.random() * defenders.length)];
            
            document.getElementById('atk-name').innerText = atk;
            document.getElementById('def-name').innerText = def;

            displayImage('atk-photo', atk);
            displayImage('def-photo', def);
            rerollChallenge();
        }

        function displayImage(elementId, name) {
            let n = name.toLowerCase();
            
            // Fix the numbered outliers
            if (n === "ash") n = "ash_317253";
            if (n === "kali") n = "kali_358317";
            if (n === "mozzie") n = "mozzie_343537";
            if (n === "wamai") n = "wamai_358318";
            if (n === "deimos") n = "denari_2";

            const folder = "siegeimages";
            const ext = ".avif";
            
            // All 4 possible variations seen in your folder
            const prefixes = [
                "r6-operators-list-", 
                "r6s-operators-list-", 
                "r6s-operator-list-",
                "r6-operator-list-"
            ];
            
            const container = document.getElementById(elementId);
            let attempt = 0;

            function tryLoad() {
                if (attempt >= prefixes.length) {
                    container.innerHTML = `<span style="color:#555">Error: ${name}</span>`;
                    return;
                }
                
                const img = new Image();
                const currentUrl = `${folder}/${prefixes[attempt]}${n}${ext}`;
                
                img.onload = function() {
                    container.innerHTML = `<img src="${currentUrl}" alt="${name}">`;
                };
                
                img.onerror = function() {
                    attempt++;
                    tryLoad(); // Try the next prefix
                };
                
                img.src = currentUrl;
            }

            tryLoad();
        }

        function rerollChallenge() {
            const chal = challenges[Math.floor(Math.random() * challenges.length)];
            document.getElementById('challenge-display').innerHTML = chal.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }
    </script>
</body>
</html>
