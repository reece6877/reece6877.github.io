<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R6S Challenge Generator</title>
    <style>
        :root {
            --r6-orange: #ffaa00;
            --r6-dark: #1a1a1a;
            --r6-gray: #2d2d2d;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--r6-dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            border-bottom: 4px solid var(--r6-orange);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .generator-container {
            background-color: var(--r6-gray);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 850px;
            width: 100%;
            border: 1px solid #444;
        }

        .ops-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }

        .op-card {
            flex: 1;
            background: #111;
            padding: 15px;
            border-top: 5px solid var(--r6-orange);
            border-radius: 4px;
        }

        .op-photo-box {
            width: 100%;
            height: 280px;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .op-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .op-name {
            font-weight: bold;
            font-size: 1.3rem;
            text-transform: uppercase;
            color: var(--r6-orange);
            letter-spacing: 1px;
        }

        .op-type {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        #challenge-display {
            min-height: 80px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 170, 0, 0.05);
            border-left: 5px solid var(--r6-orange);
            font-size: 1.1rem;
            line-height: 1.5;
            text-align: left;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--r6-orange);
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #ffc247;
            transform: translateY(-2px);
        }

        button.secondary {
            background-color: #444;
            color: white;
        }

        button.secondary:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <h1>R6S Squad Challenges</h1>

    <div class="generator-container">
        <div class="ops-display">
            <div class="op-card">
                <div class="op-photo-box" id="atk-photo">
                    <span style="color:#555">?</span>
                </div>
                <div class="op-name" id="atk-name">Attacker</div>
                <div class="op-type">ATTACK ROLE</div>
            </div>

            <div class="op-card">
                <div class="op-photo-box" id="def-photo">
                    <span style="color:#555">?</span>
                </div>
                <div class="op-name" id="def-name">Defender</div>
                <div class="op-type">DEFENSE ROLE</div>
            </div>
        </div>

        <div id="challenge-display">
            Click "Generate Full Loadout" to start your mission.
        </div>

        <div class="btn-group">
            <button onclick="generateAll()">Generate Full Loadout</button>
            <button class="secondary" onclick="rerollChallenge()">New Challenge Only</button>
        </div>
    </div>

    <script>
        const attackers = ["Sledge", "Thatcher", "Ash", "Thermite", "Twitch", "Montagne", "Glaz", "Fuze", "Blitz", "IQ", "Buck", "Blackbeard", "Capitao", "Hibana", "Jackal", "Ying", "Zofia", "Dokkaebi", "Lion", "Finka", "Maverick", "Nomad", "Gridlock", "Nokk", "Amaru", "Kali", "Iana", "Ace", "Zero", "Flores", "Osa", "Sens", "Grim", "Brava", "Ram", "Deimos", "Striker", "Rauora", "Solidsnake"];
        const defenders = ["Smoke", "Mute", "Castle", "Pulse", "Doc", "Rook", "Kapkan", "Tachanka", "Jager", "Bandit", "Frost", "Valkyrie", "Caveira", "Echo", "Mira", "Lesion", "Ela", "Vigil", "Maestro", "Alibi", "Clash", "Kaid", "Mozzie", "Warden", "Goyo", "Wamai", "Oryx", "Melusi", "Aruni", "Thunderbird", "Thorn", "Azami", "Solis", "Fenrir", "Tubarao", "Sentry", "Skopos"];

        const challenges = [
            "**Iron Sights Only:** Remove all optics from your weapons. You must win using only standard iron sights.",
            "**Pistol/Secondary Only:** You are only allowed to use your secondary weapon (pistols, machine pistols, or the Deagle) for the entire match.",
            "**The Pacifist Medic:** Play Doc and your only goal is to stim teammates and, if you're feeling crazy, try to stim an enemy without getting shot.",
            "**Hide & Seek Mira:** As Mira, find a corner on the site (or even off-site) and just watch people walk by through your mirror without shooting them.",
            "**The Kap-Man:** Place all of Kapkan's traps on a single door or window to create a massive firework show.",
            "**Shield Rush:** Get your squad to all pick shield operators (Blitz, Montagne, Fuze with shield) and rush the objective at the same time.",
            "**The Backpack:** One of you plays Montagne (Shield), and the other plays a high-firepower op (like Ash or Zofia). The shooter must stay directly behind Monty’s back. If Monty dies, the shooter has to prone until they are killed.",
            "**The Floor is Lava:** Both of you pick operators with shotguns. You are never allowed to touch the floor of the objective room. Stay on hatches, furniture, or in the hallways.",
            "**The Distraction Duo:** One of you goes to one side of the map and makes as much noise as possible. The other person must sneak into the objective from the opposite side using only a suppressed pistol.",
            "**The Recruit Experience:** No unique gadgets allowed. You can only use your primary weapon. If you accidentally press your gadget key, stare at a wall for 10 seconds as punishment.",
            "**Luddite Mode:** No electronic gadgets. No drones, no cameras, no Pulse scanners, and no hacking. If it has a screen or a battery, it’s banned.",
            "**The Heavyweight:** No sprinting and no vaulting. Walk everywhere. If a wall is in your way, you have to find a door or blow a hole in it.",
            "**The Stay Together Tether:** You and your partner must stay within 5 meters of each other at all times. If the tether breaks, stop until you are touching again.",
            "**The Silent But Deadly:** No primary weapons and no sprinting. Use suppressed secondaries. If spotted, you must retreat—no going loud.",
            "**Utility Only:** No guns allowed until the final 45 seconds of the round. Use secondary gadgets (flashes, smokes, claymores) to mess with the enemies."
        ];

        function getFilename(name) {
            let n = name.toLowerCase();
            // Handling the specific weird filenames from your screenshot
            if (n === "ash") return "ash_317253";
            if (n === "kali") return "kali_358317";
            if (n === "mozzie") return "mozzie_343537";
            if (n === "wamai") return "wamai_358318";
            if (n === "deimos") return "denari_2";
            return n;
        }

        function generateAll() {
            const atk = attackers[Math.floor(Math.random() * attackers.length)];
            const def = defenders[Math.floor(Math.random() * defenders.length)];
            
            // Update UI Names
            document.getElementById('atk-name').innerText = atk;
            document.getElementById('def-name').innerText = def;

            // Set Image Paths
            const folder = "siegeimages";
            const prefix = "r6-operators-list-";
            const ext = ".avif";

            const atkImg = `${folder}/${prefix}${getFilename(atk)}${ext}`;
            const defImg = `${folder}/${prefix}${getFilename(def)}${ext}`;

            // Update Photos
            document.getElementById('atk-photo').innerHTML = `<img src="${atkImg}" alt="${atk}" onerror="this.src='https://placehold.co/200x280?text=Check+Name'">`;
            document.getElementById('def-photo').innerHTML = `<img src="${defImg}" alt="${def}" onerror="this.src='https://placehold.co/200x280?text=Check+Name'">`;

            rerollChallenge();
        }

        function rerollChallenge() {
            const chal = challenges[Math.floor(Math.random() * challenges.length)];
            document.getElementById('challenge-display').innerHTML = chal.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }
    </script>
</body>
</html>
