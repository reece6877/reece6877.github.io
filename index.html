<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R6 Random Challenge Wheel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #wheel-container { position: relative; width: 350px; height: 350px; border: 5px solid #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }
        #pointer { position: absolute; top: -10px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #00d2ff; z-index: 10; }
        .challenge-display { margin-top: 30px; text-align: center; padding: 20px; background: #16213e; border-radius: 10px; width: 80%; max-width: 500px; min-height: 80px; border: 2px solid #0f3460; }
        button { margin-top: 20px; padding: 15px 40px; font-size: 1.2rem; cursor: pointer; background: #e94560; color: white; border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #ff4d6d; }
        h1 { color: #00d2ff; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <h1>R6 Strat Roulette</h1>
    <div id="pointer"></div>
    <div id="wheel-container">
        <div style="width: 100%; height: 100%; background: repeating-conic-gradient(#0f3460 0 15deg, #16213e 0 30deg);"></div>
    </div>

    <div class="challenge-display">
        <h2 id="challenge-text">Click Spin to start the chaos...</h2>
        <p id="challenge-desc"></p>
    </div>

    <button onclick="spinWheel()">SPIN THE WHEEL</button>

    <script>
        const challenges = [
            { title: "The Turtle", desc: "Shield ops only. You must stay crouched the entire round." },
            { title: "No Leaning", desc: "Unbind your Q and E keys (or just don't touch them). Play straight up." },
            { title: "The Recruit Spirit", desc: "Iron sights only. No attachments allowed on any primary." },
            { title: "One Bullet Dream", desc: "Empty your mag to 1 bullet at the start of every encounter. Good luck." },
            { title: "Hip-Fire Only", desc: "Aiming down sights is forbidden. Spray and pray." },
            { title: "The Worm", desc: "You must be prone to shoot. If you're standing/crouched, you can't fire." },
            { title: "Gadget Fatality", desc: "You must use/destroy all of your utility within the first 30 seconds." },
            { title: "The Blind Monk", desc: "Turn your brightness to 0 or play with your HUD completely off." },
            { title: "Secondary Specialist", desc: "Pistols/Secondaries only. Your primary gun is decorative." },
            { title: "Shotgun Party", desc: "Whole team must run shotguns. No exceptions." },
            { title: "The Moonwalker", desc: "You can only move backwards or sideways. No forward key." },
            { title: "T-Bag Bonanza", desc: "Every time you see an enemy, you must T-bag before you can shoot." },
            { title: "Ghost Hunter", desc: "Follow an enemy without them seeing you for as long as possible before killing." },
            { title: "No Sprinting", desc: "Your shift key is broken. Walk everywhere like a horror movie villain." },
            { title: "Trigger Happy", desc: "Once you start shooting, you cannot stop until the mag is empty." },
            { title: "The Mirror", desc: "You must use the exact same operator that killed you last round." }
        ];

        let currentRotation = 0;

        function spinWheel() {
            const wheel = document.getElementById('wheel-container');
            const title = document.getElementById('challenge-text');
            const desc = document.getElementById('challenge-desc');
            
            // Random spin animation
            const addedRotation = 1440 + Math.floor(Math.random() * 360);
            currentRotation += addedRotation;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Pick challenge
            title.innerText = "Spinning...";
            desc.innerText = "";

            setTimeout(() => {
                const randomChallenge = challenges[Math.floor(Math.random() * challenges.length)];
                title.innerText = randomChallenge.title;
                desc.innerText = randomChallenge.desc;
            }, 4000);
        }
    </script>
</body>
</html>
