<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R6S Challenge Generator</title>
    <style>
        :root { --r6-orange: #ffaa00; --r6-dark: #1a1a1a; --r6-gray: #2d2d2d; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--r6-dark); color: var(--white); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .generator-container { background-color: var(--r6-gray); padding: 30px; border-radius: 12px; text-align: center; max-width: 800px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #444; }
        .ops-display { display: flex; justify-content: space-around; margin-bottom: 30px; gap: 20px; }
        .op-card { flex: 1; background: #111; padding: 15px; border-top: 5px solid var(--r6-orange); border-radius: 4px; }
        .op-photo-box { width: 100%; height: 250px; background-color: #222; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333; }
        .op-photo-box img { width: 100%; height: 100%; object-fit: contain; }
        .op-name { font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; color: var(--r6-orange); }
        #challenge-display { min-height: 80px; margin: 20px 0; padding: 20px; background: rgba(255, 170, 0, 0.1); border-left: 5px solid var(--r6-orange); font-size: 1.1rem; line-height: 1.4; font-weight: 500; }
        button { background-color: var(--r6-orange); padding: 18px 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; color: #000; }
        button:hover { background-color: #ffc247; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>

    <h1 style="letter-spacing: 3px; margin-bottom: 30px;">R6S SQUAD CHALLENGES</h1>

    <div class="generator-container">
        <div class="ops-display">
            <div class="op-card">
                <div class="op-photo-box" id="atk-photo">?</div>
                <div class="op-name" id="atk-name">ATTACKER</div>
            </div>
            <div class="op-card">
                <div class="op-photo-box" id="def-photo">?</div>
                <div class="op-name" id="def-name">DEFENDER</div>
            </div>
        </div>

        <div id="challenge-display">Click the button to roll your mission!</div>
        <button onclick="generate()">GENERATE LOADOUT</button>
    </div>

    <script>
        // Operators (No accents, and 'Solidsnake' fixed)
        const attackers = ["Sledge", "Thatcher", "Ash", "Thermite", "Twitch", "Montagne", "Glaz", "Fuze", "Blitz", "IQ", "Buck", "Blackbeard", "Capitao", "Hibana", "Jackal", "Ying", "Zofia", "Dokkaebi", "Lion", "Finka", "Maverick", "Nomad", "Gridlock", "Nokk", "Amaru", "Kali", "Iana", "Ace", "Zero", "Flores", "Osa", "Sens", "Grim", "Brava", "Ram", "Deimos", "Striker", "Rauora", "Solidsnake"];
        const defenders = ["Smoke", "Mute", "Castle", "Pulse", "Doc", "Rook", "Kapkan", "Tachanka", "Jager", "Bandit", "Frost", "Valkyrie", "Caveira", "Echo", "Mira", "Lesion", "Ela", "Vigil", "Maestro", "Alibi", "Clash", "Kaid", "Mozzie", "Warden", "Goyo", "Wamai", "Oryx", "Melusi", "Aruni", "Thunderbird", "Thorn", "Azami", "Solis", "Fenrir", "Tubarao", "Sentry", "Skopos"];
        
        const challenges = [
            "Iron Sights Only: Remove all optics from your weapons.",
            "Pistol/Secondary Only: Use only your secondary weapon for the match.",
            "The Pacifist Medic: Play Doc - only heal teammates. Try to stim an enemy!",
            "Hide & Seek Mira: Watch enemies through the glass, but do not shoot them.",
            "The Kap-Man: Place ALL Kapkan traps on a single door or window.",
            "Shield Rush: Squad must pick shields (Blitz/Monty/Fuze) and rush OBJ.",
            "The Backpack: Stay directly behind Monty. If he dies, you must prone.",
            "The Floor is Lava: Shotguns only. Stay on furniture/hatches in OBJ.",
            "The Distraction Duo: One makes noise, the other sneaks in with a silencer.",
            "The Recruit: No gadgets. Accidental gadget use = 10s staring at a wall.",
            "Luddite Mode: No electronics (drones, cams, Pulse, etc.) allowed.",
            "The Heavyweight: No sprinting or vaulting. Walk everywhere.",
            "The Tether: Stay within 5 meters of your partner at all times.",
            "Silent But Deadly: No primary, no sprinting. Suppressed secondaries only.",
            "Utility Only: No guns until the final 45 seconds of the round."
        ];

        function generate() {
            const atkRaw = attackers[Math.floor(Math.random() * attackers.length)];
            const defRaw = defenders[Math.floor(Math.random() * defenders.length)];
            const chal = challenges[Math.floor(Math.random() * challenges.length)];

            // Update UI text
            document.getElementById('atk-name').innerText = atkRaw;
            document.getElementById('def-name').innerText = defRaw;
            document.getElementById('challenge-display').innerText = chal;

            // Folder path and file naming logic
            const folder = "siegeimages";
            const prefix = "r6-operators-list-";
            const ext = ".avif";

            // Build the image paths
            const atkImg = `${folder}/${prefix}${atkRaw.toLowerCase()}${ext}`;
            const defImg = `${folder}/${prefix}${defRaw.toLowerCase()}${ext}`;

            // Update images (with a safety check if file is missing)
            document.getElementById('atk-photo').innerHTML = `<img src="${atkImg}" alt="${atkRaw}" onerror="this.src='https://placehold.co/200x250?text=Missing+Image'">`;
            document.getElementById('def-photo').innerHTML = `<img src="${defImg}" alt="${defRaw}" onerror="this.src='https://placehold.co/200x250?text=Missing+Image'">`;
        }
    </script>
</body>
</html>
